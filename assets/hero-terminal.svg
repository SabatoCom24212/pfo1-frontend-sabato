<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Ilustración de una ventana de terminal con un gráfico de barras, un candado y un símbolo de bug conectados por líneas, representando datos, ciberseguridad y testing</title>
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161d19"/>
      <stop offset="100%" stop-color="#10150f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="520" height="380" rx="10" fill="url(#panelGrad)" stroke="#223028" stroke-width="1.5"/>

  <rect x="20" y="20" width="520" height="34" rx="10" fill="#141a16"/>
  <circle cx="44" cy="37" r="6" fill="#ff6b81"/>
  <circle cx="64" cy="37" r="6" fill="#f0a868"/>
  <circle cx="84" cy="37" r="6" fill="#6ee7d8"/>
  <text x="280" y="42" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a9a92">angel@portfolio: ~</text>

  <text x="44" y="90" font-family="monospace" font-size="14" fill="#6ee7d8">$ whoami</text>
  <text x="44" y="112" font-family="monospace" font-size="13" fill="#e7ede9">angel_sabato</text>

  <g transform="translate(60,150)" filter="url(#softGlow)">
    <rect x="0" y="70" width="18" height="60" rx="2" fill="#f0a868"/>
    <rect x="26" y="40" width="18" height="90" rx="2" fill="#f0a868"/>
    <rect x="52" y="90" width="18" height="40" rx="2" fill="#c98a52"/>
    <rect x="78" y="20" width="18" height="110" rx="2" fill="#f0a868"/>
    <rect x="104" y="60" width="18" height="70" rx="2" fill="#c98a52"/>
  </g>
  <text x="60" y="300" font-family="monospace" font-size="11" fill="#8a9a92">datos &amp; ml</text>

  <g transform="translate(250,150)" filter="url(#softGlow)">
    <path d="M35 0 C15 0 8 12 8 28 L8 40 L2 40 L2 100 L68 100 L68 40 L62 40 L62 28 C62 12 55 0 35 0 Z M35 14 C47 14 50 22 50 30 L50 40 L20 40 L20 30 C20 22 23 14 35 14 Z" fill="#6ee7d8"/>
    <circle cx="35" cy="70" r="8" fill="#10150f"/>
  </g>
  <text x="255" y="300" font-family="monospace" font-size="11" fill="#8a9a92">ciberseguridad</text>

  <g transform="translate(400,150)" filter="url(#softGlow)">
    <ellipse cx="35" cy="55" rx="26" ry="34" fill="none" stroke="#ff6b81" stroke-width="4"/>
    <line x1="35" y1="10" x2="35" y2="0" stroke="#ff6b81" stroke-width="4"/>
    <line x1="12" y1="30" x2="0" y2="20" stroke="#ff6b81" stroke-width="4"/>
    <line x1="58" y1="30" x2="70" y2="20" stroke="#ff6b81" stroke-width="4"/>
    <line x1="9" y1="55" x2="0" y2="55" stroke="#ff6b81" stroke-width="4"/>
    <line x1="61" y1="55" x2="70" y2="55" stroke="#ff6b81" stroke-width="4"/>
    <line x1="12" y1="80" x2="0" y2="90" stroke="#ff6b81" stroke-width="4"/>
    <line x1="58" y1="80" x2="70" y2="90" stroke="#ff6b81" stroke-width="4"/>
    <line x1="35" y1="21" x2="35" y2="89" stroke="#ff6b81" stroke-width="3"/>
  </g>
  <text x="400" y="300" font-family="monospace" font-size="11" fill="#8a9a92">testing &amp; qa</text>

  <line x1="120" y1="200" x2="270" y2="200" stroke="#223028" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="330" y1="200" x2="415" y2="200" stroke="#223028" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="44" y="360" font-family="monospace" font-size="13" fill="#6ee7d8">$ <tspan fill="#e7ede9">echo "en constante aprendizaje"</tspan><tspan fill="#f0a868">_</tspan></text>
</svg>
